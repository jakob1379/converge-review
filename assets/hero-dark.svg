<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="t">
<title id="t">converge-review: four independent reviewers converge on one ranked list</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111c2e"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1f2a3a"/></pattern>
<linearGradient id="fadeR" x1="0" x2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="880" height="240" fill="url(#fadeR)"/></mask>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #9198a1; }
.edge { fill: none; stroke: #3a424d; stroke-width: 1.5; stroke-dasharray: 100; stroke-dashoffset: 0; animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
.comet { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 16 200; stroke-dashoffset: -100; opacity: 0; animation: travel 2.4s cubic-bezier(.45,0,.25,1) infinite; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; }
.fade { animation: fade .9s ease-out both; }
.rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.orbit { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 2.4s ease-out 2.9s infinite; }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes travel { 0% { stroke-dashoffset: 10; opacity: 0; } 8% { opacity: 1; } 42% { stroke-dashoffset: -96; opacity: 1; } 50%, 100% { stroke-dashoffset: -100; opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes ring { 0% { opacity: .55; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
<rect width="880" height="240" rx="18" fill="url(#bg)"/>
<rect width="880" height="240" rx="18" fill="url(#dots)" mask="url(#m)"/>
<rect x="0.5" y="0.5" width="879" height="239" rx="17.5" fill="none" stroke="#30363d"/>
<circle cx="700" cy="120" r="90" fill="url(#halo)"/>
<circle class="orbit" cx="700" cy="120" r="36" fill="none" stroke="#3a424d" stroke-width="1" stroke-dasharray="2 6"/>
<g class="rise"><text x="44" y="104" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#e6edf3">converge-review</text></g>
<g class="rise" style="animation-delay:.15s">
<text x="46" y="140" font-size="17" fill="#9198a1">Four blind reviewers. One list, ranked by agreement.</text>
<text x="46" y="164" font-size="17" fill="#9198a1">Fixes behind red tests, re-reviewed until clean.</text>
</g>
<g class="rise" style="animation-delay:.3s">
<rect x="46" y="184" width="150" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
<text x="121" y="203" text-anchor="middle" style="font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">/converge-review</text>
<text x="212" y="203" font-size="13" fill="#6e7681">a Claude Code skill</text>
</g>
<path class="edge" d="M600,62 Q615.0,114.2 700,120" pathLength="100" style="animation-delay:0.50s"/><path class="edge" d="M800,62 Q785.0,114.2 700,120" pathLength="100" style="animation-delay:0.62s"/><path class="edge" d="M600,178 Q615.0,125.8 700,120" pathLength="100" style="animation-delay:0.74s"/><path class="edge" d="M800,178 Q785.0,125.8 700,120" pathLength="100" style="animation-delay:0.86s"/>
<g filter="url(#soft)" opacity=".9"><path class="comet" d="M600,62 Q615.0,114.2 700,120" pathLength="100" stroke="#3987e5" style="animation-delay:2.0s"/><path class="comet" d="M800,62 Q785.0,114.2 700,120" pathLength="100" stroke="#3987e5" style="animation-delay:2.6s"/><path class="comet" d="M600,178 Q615.0,125.8 700,120" pathLength="100" stroke="#9085e9" style="animation-delay:3.2s"/><path class="comet" d="M800,178 Q785.0,125.8 700,120" pathLength="100" stroke="#9085e9" style="animation-delay:3.8s"/></g>
<path class="comet" d="M600,62 Q615.0,114.2 700,120" pathLength="100" stroke="#3987e5" style="animation-delay:2.0s"/><path class="comet" d="M800,62 Q785.0,114.2 700,120" pathLength="100" stroke="#3987e5" style="animation-delay:2.6s"/><path class="comet" d="M600,178 Q615.0,125.8 700,120" pathLength="100" stroke="#9085e9" style="animation-delay:3.2s"/><path class="comet" d="M800,178 Q785.0,125.8 700,120" pathLength="100" stroke="#9085e9" style="animation-delay:3.8s"/>
<g class="pop" style="animation-delay:0.20s"><circle cx="600" cy="62" r="11" fill="#0d1117" stroke="#3987e5" stroke-width="2"/><circle cx="600" cy="62" r="4.5" fill="#3987e5"/></g><g class="pop" style="animation-delay:0.32s"><circle cx="800" cy="62" r="11" fill="#0d1117" stroke="#3987e5" stroke-width="2"/><circle cx="800" cy="62" r="4.5" fill="#3987e5"/></g><g class="pop" style="animation-delay:0.44s"><circle cx="600" cy="178" r="11" fill="#0d1117" stroke="#9085e9" stroke-width="2"/><circle cx="600" cy="178" r="4.5" fill="#9085e9"/></g><g class="pop" style="animation-delay:0.56s"><circle cx="800" cy="178" r="11" fill="#0d1117" stroke="#9085e9" stroke-width="2"/><circle cx="800" cy="178" r="4.5" fill="#9085e9"/></g>
<text class="mono fade" x="600" y="40" text-anchor="middle" style="animation-delay:0.50s">open-code-review</text><text class="mono fade" x="800" y="40" text-anchor="middle" style="animation-delay:0.62s">superpowers</text><text class="mono fade" x="600" y="209" text-anchor="middle" style="animation-delay:0.74s">ponytail</text><text class="mono fade" x="800" y="209" text-anchor="middle" style="animation-delay:0.86s">mattpocock</text>
<circle class="ring" cx="700" cy="120" r="15" fill="none" stroke="#3987e5" stroke-width="1.5"/>
<g class="pop" style="animation-delay:.9s">
<circle cx="700" cy="120" r="15" fill="#3987e5"/>
<path d="M694,120 l4,4.5 l8,-9" fill="none" stroke="#0d1117" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
