<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
.cap { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #6e7681; }
.sub { font-size: 12.5px; fill: #9198a1; }
.edge { fill: none; stroke: #3a424d; stroke-width: 1.5; }
.comet { fill: none; stroke: #58a6ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 12 200; stroke-dashoffset: -100; opacity: 0; animation: travel 16.0s linear infinite; }
.comet.red { stroke: #f85149; }
.glow { fill: #58a6ff; fill-opacity: .07; stroke: #58a6ff; stroke-width: 1.5; opacity: 0; animation: glow 16.0s ease-in-out infinite; }
.fail { opacity: 0; animation: fail 16.0s step-end infinite; }
@keyframes travel { 0% { stroke-dashoffset: 12; opacity: 0; } 1% { opacity: 1; } 7% { stroke-dashoffset: -98; opacity: 1; } 7.6%, 100% { stroke-dashoffset: -100; opacity: 0; } }
@keyframes glow { 0% { opacity: 0; } 2.5%, 8% { opacity: 1; } 13%, 100% { opacity: 0; } }
@keyframes fail { 0% { opacity: 1; } 7% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
