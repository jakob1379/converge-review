<title id="t">The converge-review loop: patch, four blind seats, merge and rank by agreement, fix behind red tests, scoped re-review, converged</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#6e7681" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
